[bar.default]
end = [ "cat", "tray", "bluetooth", "volume", "brightness", "battery", "nix-monitor", "widget" ]
font_family = "JetBrainsMono Nerd Font Mono"
margin_ends = 140
show_on_workspace_switch = false
start = [ "workspaces", "spacer_2", "cat_2", "battery-threshold" ]
thickness = 32

[[control_center.shortcuts]]
type = "wifi"

[[control_center.shortcuts]]
type = "bluetooth"

[[control_center.shortcuts]]
type = "caffeine"

[[control_center.shortcuts]]
type = "nightlight"

[[control_center.shortcuts]]
type = "lux/ideapad-conservation-mode:conservation-mode"

[[control_center.shortcuts]]
type = "power_profile"

[idle]
behavior_order = [ "screen-off", "idle-behavior" ]

    [idle.behavior.idle-behavior]
    action = "suspend"
    enabled = true
    lock_before_suspend = false
    timeout = 600.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 200.0

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@WAYLAND-1", "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@WAYLAND-1"]
    box_height = 196.0
    box_width = 482.0
    cx = 257.0
    cy = 434.0
    output = "WAYLAND-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@WAYLAND-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 800.0
    cy = 818.0
    output = "eDP-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[osd.kinds]
lock_keys = false
media = false

[plugin_settings."avivbintangaringga/nix-monitor"]
update_command = "nh os switch"

[plugin_settings."damian-ds7/battery-threshold"]
battery_device = "/sys/class/power_supply/BAT0/device"

[plugins]
enabled = [ "noctalia/bongocat", "thepunkoff/pomodoro", "lux/ideapad-conservation-mode", "dotnetrob/cat" ]

[shell]
app_icon_color = "primary"
font_family = "JetBrainsMono Nerd Font Propo"
polkit_agent = true

    [shell.screen_corners]
    enabled = true
    size = 24

    [shell.shadow]
    direction = "center"

[templates.nvim-base16]
input_path = "~/.config/nvim/lua/matugen-template.lua"
output_path = "~/.config/nvim/lua/matugen.lua"
post_hook = "pkill -SIGUSR1 nvim"

[theme]
builtin = "Ayu"
mode = "dark"
pure_black_dark = true
source = "wallpaper"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "foot", "gtk3", "gtk4", "hyprland", "qt" ]
    community_ids = [ "zen-browser", "telegram", "neovim", "vscode" ]

        [theme.templates.user.obsidian_extra]
        input_path = "obsidian/obsidian.css"
        output_path = "/home/vlmsk/ObsidianVault/vlmsk/.obsidian/snippets/noctalia.css"

[wallpaper]
directory = "/home/vlmsk/walls"

    [wallpaper.default]
    path = "/home/vlmsk/walls/pixel-napping.png"

    [wallpaper.last]
    path = "/home/vlmsk/walls/pixel-napping.png"

    [wallpaper.monitors.eDP-1]
    path = "/home/vlmsk/walls/pixel-napping.png"

[widget.battery-threshold]
type = "damian-ds7/battery-threshold:battery-threshold"

[widget.cat]
input_devices = [ "/dev/input/by-path/platform-i8042-serio-0-event-kbd" ]
scale = 1.1000000000000001
type = "noctalia/bongocat:cat"

[widget.cat_2]
cat_color = "on_surface"
cat_color_mode = "custom"
cat_size = 32
run_threshold = 50
type = "dotnetrob/cat:cat"
walk_threshold = 10

[widget.nix-monitor]
type = "avivbintangaringga/nix-monitor:nix-monitor"

[widget.spacer_2]
length = 10
type = "spacer"

[widget.widget]
type = "thepunkoff/pomodoro:widget"
